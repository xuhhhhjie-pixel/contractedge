[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "contractedge-system"
dynamic = ["version"]
description = "Snapshot-bound requirement, diagnosis, semantic planning, repair and public feedback for ContractEdge"
requires-python = ">=3.10"
dependencies = [
  "PyYAML>=5.4.1,<7",
  "jsonschema==4.26.0",
]

[project.optional-dependencies]
common-live = ["mini-swe-agent==1.17.5"]
pilot = ["transformers>=4.45"]
topomen = [
  "pydantic>=2,<3",
  "rich",
  "python-dotenv",
  "jinja2",
  "platformdirs",
  "litellm>=1.75.5",
  "tenacity",
  "openai!=1.100.0,!=1.100.1",
]

[project.scripts]
contractedge = "contractedge.cli:main"
contractedge-common-live = "contractedge.graph_repair.harness.common_entry:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "contractedge.__version__"}

[tool.setuptools.package-data]
"contractedge.contracts" = ["schema/*.json"]
"contractedge.experiments" = ["m1-*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
