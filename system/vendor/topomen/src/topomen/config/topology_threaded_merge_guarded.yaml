agent:
  agent_class: topology_repair_memory
  experiment_group: topology-threaded-merge-guarded
  experiment_runs_path: experiments/results/runs/topology_threaded_merge_guarded_runs.jsonl
  record_successful_repairs: false
  topology_enabled: true
  topology_artifacts_dir: experiments/results/topologies
  topology_artifacts_svg_enabled: true
  topology_max_workers: 4
  topology_prefill_dockerfile: true
  topology_repair_scope: node_block
  topology_guard_enabled: true
  topology_prefill_validate_first: true
  topology_scheduler_enabled: true
  topology_guard_restore_invalid: true
  topology_multistage_enabled: false
  topology_threaded_build_enabled: true
  topology_build_scheduler_strategy: legacy_threaded
  topology_build_cache_enabled: true
  topology_build_cache_namespace: topomen-threaded
  topology_build_cache_reuse_existing: true
  topology_docker_registry_mirror_enabled: true
  topology_docker_registry_mirror: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io
  topology_docker_buildkit_frontend_image: docker/dockerfile:1.7
  topology_parallel_build_max_workers: 3
  topology_parallel_repair_enabled: false
  topology_parallel_repair_max_branches: 3
  track_command_timing: true
  agent_wall_clock_timeout_seconds: 3600
  command_timeout_seconds: 180
  docker_build_timeout_seconds: 1800
  docker_run_timeout_seconds: 900
  topology_guard_max_violations_per_node: 2
  topology_guard_max_skipped_nodes: 3
