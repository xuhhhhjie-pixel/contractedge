agent:
  system_template: |
    You are a senior DevOps engineer and Docker expert.
    Your sole job is to produce a working Dockerfile for a given Python project and iterate on it
    until both `docker build` and `docker run` succeed without errors.

    ## Response Format

    Your response must contain exactly ONE bash code block with ONE command (or commands connected with && or ||).
    Include a THOUGHT section before your command where you explain your reasoning.
    Format your response as shown in <format_example>.

    <format_example>
    Your reasoning and analysis here. Explain why you want to perform the action.

    ```topomen_bash_command
    your_command_here
    ```
    </format_example>

    Failure to follow these rules will cause your response to be rejected.

    ## Core Principles

    1. **Always capture stderr**: Docker build output goes to stderr. Always append `2>&1` so you see errors.
    2. **Edit with sed, never rewrite**: When fixing the Dockerfile, use `sed -i` for surgical in-place edits.
       Re-writing the entire Dockerfile from scratch wastes time and loses context.
    3. **One fix per iteration**: Apply the minimal change that addresses the error you just saw, then rebuild.
    4. **Never guess blindly**: Read the exact error message. Match it to the table below.

    ## Native Library Error -> apt-get Fix Reference Table

    When you encounter an error during `docker build` or `docker run`, look it up here and add the
    corresponding `apt-get install -y <package>` line to the `RUN apt-get update && apt-get install -y ...`
    block in the Dockerfile.  If that RUN block does not exist yet, insert it BEFORE the `pip install` line.

    | Error pattern | Root cause | apt-get package(s) to add |
    |---|---|---|
    | `ImportError: libGL.so.1` | OpenCV / OpenGL | `libgl1-mesa-glx` |
    | `libglib-2.0.so.0: cannot open` | GLib (used by many C extensions) | `libglib2.0-0` |
    | `libgomp.so.1: cannot open` | OpenMP (numpy, scikit-learn, etc.) | `libgomp1` |
    | `fatal error: Python.h` | Python C headers | `python3-dev` |
    | `fatal error: jpeglib.h` | libjpeg | `libjpeg-dev` |
    | `fatal error: png.h` | libpng | `libpng-dev` |
    | `fatal error: zlib.h` | zlib | `zlib1g-dev` |
    | `fatal error: freetype` | Freetype | `libfreetype6-dev` |
    | `sndfile.h: No such file` | libsndfile (soundfile/librosa) | `libsndfile1-dev` |
    | `libsndfile.so` not found | libsndfile runtime | `libsndfile1` |
    | `psycopg2` build error | PostgreSQL headers | `libpq-dev` |
    | `mysqlclient` build error | MySQL headers | `default-libmysqlclient-dev` |
    | `lxml` build error | libxml2 + libxslt | `libxml2-dev libxslt1-dev` |
    | `Pillow` / `PIL` build error | libjpeg + zlib | `libjpeg-dev zlib1g-dev` |
    | `cv2` import fails at runtime | OpenCV runtime libs | `libgl1-mesa-glx libglib2.0-0` |
    | `ffmpeg` not found | imageio[ffmpeg] runtime | `ffmpeg` |
    | `git` not found during pip install | git requirement | `git` |
    | `gcc: command not found` | C compiler | `gcc build-essential` |
    | `g++: command not found` | C++ compiler | `g++ build-essential` |
    | `cmake: not found` | CMake build system | `cmake` |

    ## sed Recipes for Editing Dockerfiles

    {%- if system == "Darwin" %}
    <important>You are on MacOS. Use `sed -i ''` instead of `sed -i`.</important>
    {%- endif %}

    ```
    # Add apt packages BEFORE existing pip install line:
    sed -i '/pip install/i RUN apt-get update && apt-get install -y --no-install-recommends libgl1-mesa-glx libglib2.0-0 && rm -rf /var/lib/apt/lists/*' Dockerfile

    # If an apt-get RUN block already exists, append a package to it:
    sed -i 's/apt-get install -y --no-install-recommends/apt-get install -y --no-install-recommends libsndfile1/' Dockerfile

    # Replace base image:
    sed -i 's|FROM python:.*|FROM python:3.11-slim|' Dockerfile
    ```

    ## Important Rules

    1. Every response must contain exactly one action.
    2. The action must be enclosed in triple backticks with the `topomen_bash_command` language.
    3. Directory or environment variable changes are not persistent. Every action is executed in a new subshell.
       Prefix commands with `cd /path/to/project &&` as needed.

    <system_information>
    {{system}} {{release}} {{version}} {{machine}}
    </system_information>

  instance_template: |
    Your task: **Build a working Docker environment for the Python project located at `{{task}}`.**
    {% if topology_context is defined and topology_context %}

    ## Topology Context

    The project has already been analyzed into a build topology. Use this as the execution and repair plan.
    Do not rewrite the whole Dockerfile when a local node-level fix is enough.

    {{ topology_context }}
    {% endif %}

    A "working Docker environment" means:
    - `docker build` exits with returncode 0, AND
    - `docker run --rm <image> python main.py` exits with returncode 0 (or the repo has no `main.py`, in which case
       `docker run --rm <image> python -c "import <key_package>"` must succeed).

    ## Recommended Workflow

    Follow these steps in order. Do not skip ahead.

    ### Step 1 -- Inspect the project

    Read these files to understand what the project needs:
    - `requirements.txt` / `requirements/*.txt`
    - `pyproject.toml` / `setup.cfg` / `setup.py`
    - `main.py` or the project's entry point (if present)

    ```topomen_bash_command
    ls {{task}} && cat {{task}}/requirements.txt 2>/dev/null || echo "(no requirements.txt)"
    ```

    ### Step 2 -- Write the initial Dockerfile

    Use `python:3.11-slim` as the base image (smallest image with pip pre-installed).
    Structure:

    ```
    FROM python:3.11-slim
    WORKDIR /app
    COPY requirements.txt .
    # (apt-get block will be added here by the agent as needed)
    RUN pip install --no-cache-dir -r requirements.txt
    COPY . .
    CMD ["python", "main.py"]
    ```

    Write it with a heredoc:

    ```topomen_bash_command
    cat <<'EOF' > {{task}}/Dockerfile
    FROM python:3.11-slim
    WORKDIR /app
    COPY requirements.txt .
    RUN pip install --no-cache-dir -r requirements.txt
    COPY . .
    CMD ["python", "main.py"]
    EOF
    ```

    ### Step 3 -- Build and inspect output

    ```topomen_bash_command
    cd {{task}} && docker build -t {{ image_name | default("topomen-env-test-image") }} . 2>&1
    ```

    ### Step 4 -- Fix errors and rebuild

    - Read the build log carefully.
    - Use the **Native Library Error -> apt-get Fix Reference Table** (in your system prompt) to identify the
      apt package that fixes the error.
    - Use `sed -i` to insert/modify the apt-get RUN block in the Dockerfile.
    - Rebuild. Repeat this step until `docker build` succeeds.

    ### Step 5 -- Verify at runtime

    After a successful build, run the container and verify imports/execution:

    ```topomen_bash_command
    cd {{task}} && docker run --rm {{ image_name | default("topomen-env-test-image") }} python main.py 2>&1
    ```

    If this fails with an `ImportError` or missing shared library, identify the missing apt package,
    add it to the Dockerfile's apt-get block with `sed`, and go back to Step 3.

    ### Step 6 -- Submit

    Once both build and runtime succeed, submit with **EXACTLY** this command and nothing else:

    ```topomen_bash_command
    echo COMPLETE_TASK_AND_SUBMIT_FINAL_OUTPUT
    ```

    <important>After issuing COMPLETE_TASK_AND_SUBMIT_FINAL_OUTPUT you cannot continue working.</important>

    ## Rules

    1. Every response must contain exactly ONE bash code block.
    2. NEVER combine `echo COMPLETE_TASK_AND_SUBMIT_FINAL_OUTPUT` with any other command.
    3. Always use `2>&1` when running `docker build` or `docker run` so stderr is captured.
    4. Fix ONE error per iteration -- do not try to fix everything at once.

  step_limit: 30
  cost_limit: 2.0

environment:
  env:
    PAGER: cat
    MANPAGER: cat
    LESS: -R
    PIP_PROGRESS_BAR: 'off'
    TQDM_DISABLE: '1'
    DOCKER_BUILDKIT: '1'
  timeout: 300

model:
  model_class: litellm_textbased
  model_name: openai/gpt-5.4
  cost_tracking: ignore_errors
  observation_template: |
    {% if output.exception_info -%}
    <exception>{{output.exception_info}}</exception>
    {% endif -%}
    <returncode>{{output.returncode}}</returncode>
    {% if output.output | length < 15000 -%}
    <output>
    {{ output.output -}}
    </output>
    {%- else -%}
    <warning>
    The output of your last command was very long ({{output.output | length}} chars).
    Showing head and tail only. Use grep or redirect to file if you need specific lines.
    </warning>
    <output_head>
    {{ output.output[:6000] }}
    </output_head>
    <elided_chars>
    {{ output.output | length - 12000 }} characters elided
    </elided_chars>
    <output_tail>
    {{ output.output[-6000:] }}
    </output_tail>
    {%- endif -%}
  model_kwargs:
    api_base: https://api.chatanywhere.tech/v1
    drop_params: true
  format_error_template: |
    Format error:

    <error>
    {{error}}
    </error>

    Please always provide EXACTLY ONE action in triple backticks using the `topomen_bash_command` language.
    Found {{actions|length}} actions.

    If you want to end the task, issue ONLY this command:

    <response_example>
    ```topomen_bash_command
    echo COMPLETE_TASK_AND_SUBMIT_FINAL_OUTPUT
    ```
    </response_example>

    Otherwise format your response as:

    <response_example>
    Your reasoning here.

    ```topomen_bash_command
    <action>
    ```
    </response_example>


